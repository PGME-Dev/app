# Gradle daemon JVM args.
# - -Xmx8192m: was 4096m. Release builds run R8 (whole-program analysis +
#   minification) on the entire class graph (app + Zoom SDK + Flutter + all
#   deps) which is memory-heavy. 4GB was tipping the daemon into OOM mid-
#   build, especially on subsequent builds in the same daemon session.
# - -XX:+ExitOnOutOfMemoryError: kill the daemon cleanly on OOM instead of
#   letting it limp along in a corrupted state — Gradle will spawn a fresh
#   daemon on the next build.
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.caching=true
kotlin.incremental=false
android.enableR8.fullMode=false
