# Gradle daemon JVM args.
# - -Xmx6144m: 8192m was too aggressive on this 15 GB Windows host — G1GC's
#   virtual-space grow attempt (~300 MB) was failing because R8/D8 also
#   need a large native heap allocation outside the Java heap during the
#   release minification pass, and Windows + IDE + emulator + browser were
#   using enough RAM that the OS couldn't satisfy the request. JVM crashed
#   with "Native memory allocation (mmap) failed to map 318767104 bytes,
#   Error detail: G1 virtual space" and -XX:+ExitOnOutOfMemoryError took it
#   down. 6 GB heap leaves enough RAM for the native R8 allocator while
#   still being well above the 4 GB threshold where R8 originally tipped.
# - If you still see the same crash on a memory-tight day, drop to 4096m
#   and run `gradle.bat --stop` between builds to release the daemon.
# - -XX:+ExitOnOutOfMemoryError: kill the daemon cleanly on OOM instead of
#   letting it limp along in a corrupted state — Gradle will spawn a fresh
#   daemon on the next build.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.caching=true
kotlin.incremental=false
android.enableR8.fullMode=false
